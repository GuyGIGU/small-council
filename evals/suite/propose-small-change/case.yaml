schema_version: "1.1"
name: propose-small-change
description: A one-file, ten-line change, asked for in plain words, gets the review's estimate in the owner's terms and nothing is dispatched before the go-ahead.
tags: [sizing, proposal]
expected_outcome: Says what the reader and the runner will do, gives tokens and minutes, then waits.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
