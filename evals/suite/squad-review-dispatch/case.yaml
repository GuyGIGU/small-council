schema_version: "1.1"
name: squad-review-dispatch
description: The one case that runs a council end to end. A /council-review of a risky change, inside the config's "approve without asking" size, goes straight to its two fixed agents — the reader and the runner, dispatched as council-worker agents — the auth bypass, a protected subject, also goes to a blind verifier, and the deliverable reports the bypass.
tags: [dispatch, review]
runs: 1
expected_outcome: exactly 2 council-worker dispatches (the reader and the runner), at least one council-verifier, and a deliverable under .council/reviews/ that reports token_ok() letting a missing token through.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
