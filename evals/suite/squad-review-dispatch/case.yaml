schema_version: "1.1"
name: squad-review-dispatch
description: The one case that runs a council end to end. A /council-review of a risky change, inside the config's "approve without asking" size, goes straight to a Squad — seats dispatched as council-worker agents, the auth bypass sent to a blind verifier of its own — and the deliverable reports the bypass.
tags: [dispatch, review]
runs: 1
expected_outcome: 2–4 council-worker dispatches (security, data integrity, tests, structure; the UI seats sit out), at least one council-verifier, and a deliverable under .council/reviews/ that reports token_ok() letting a missing token through.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
