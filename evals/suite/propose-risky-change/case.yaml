schema_version: "1.1"
name: propose-risky-change
description: A change that touches auth and a schema migration, asked for in plain words, gets the review's estimate in the owner's terms — the reader and the runner, tokens and minutes — and nothing is dispatched before the go-ahead.
tags: [sizing, proposal]
expected_outcome: Says what the two agents will do, gives tokens and minutes, and waits for the go-ahead.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
