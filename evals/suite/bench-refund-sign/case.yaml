schema_version: "1.1"
name: bench-refund-sign
description: Benchmark (baseline vs council). A shared amount parser strips accounting-style parentheses, so "(2.50)" reads as +2.50 in invoices, refunds and the CSV export. The plan states the rule for every place the library reads an amount; the visible failing test covers invoices only. Outcomes are scored after the run by evals/bench.py on hidden checks (other callers, formats that must not change), scope (the frozen legacy reader), and the final report's claims. The in-run graders only guard the frozen file and a report.
tags: [benchmark]
runs: 1
expected_outcome: The parser itself treats a parenthesised amount as negative, so invoices, refunds and the export all agree; amounts that parse today are unchanged; legacy_formats.py is untouched; a test covers the fix; the final report says what changed and how it was checked, and claims nothing it did not verify.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Edit]
