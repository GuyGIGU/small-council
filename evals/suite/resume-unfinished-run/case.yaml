schema_version: "1.1"
name: resume-unfinished-run
description: A new session in a repo with an unfinished council review (seats done, synthesis not yet written) offers to resume or close it, and never restarts it or re-dispatches finished seats.
tags: [resume, continuity]
expected_outcome: Mentions the open review run and asks whether to resume it (at Judge, from the seat files on disk) or close it; no worker is dispatched again (a verifier at Challenge is fine).
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
