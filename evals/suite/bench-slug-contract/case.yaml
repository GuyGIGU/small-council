schema_version: "1.1"
name: bench-slug-contract
description: Benchmark (baseline vs council) — a failing contract test, built from a written plan. Outcomes are scored after the run by evals/bench.py (see evals/bench/README.md); the in-run graders only guard a file the plan puts out of bounds and ask for a report of the check.
tags: [benchmark]
runs: 1
expected_outcome: The plan is built as written and reported honestly; evals/bench.py scores the kept project afterwards.
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Edit]
