name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    name: evals (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows — the same shell Claude Code uses to run the plugin's SessionStart hook,
        # so the Windows leg exercises the hook the way users' machines will.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate plugin
        run: python scripts/quick_validate.py

      - name: Structural evals
        run: python evals/run_structural.py

      - name: Hook evals
        run: python evals/run_hook.py
