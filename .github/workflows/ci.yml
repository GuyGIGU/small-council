name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    name: evals (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Git Bash on Windows — the same shell Claude Code uses to run the plugin's hooks and the
        # council helper, so the Windows leg exercises them the way users' machines will.
        shell: bash
    env:
      # macOS ships bash 3.2 at /bin/bash and BSD sed/awk/grep. The helper and hooks promise to run
      # there, so the macOS leg runs them with that bash — not a newer one found on PATH.
      COUNCIL_EVAL_BASH: ${{ matrix.os == 'macos-latest' && '/bin/bash' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Tool versions
        run: |
          "${COUNCIL_EVAL_BASH:-bash}" -c 'echo "bash $BASH_VERSION"'
          git --version
          awk --version 2>/dev/null | head -n 1 || awk -W version 2>/dev/null | head -n 1 || echo "awk: $(command -v awk) (BSD)"

      - name: Validate plugin
        run: python scripts/quick_validate.py

      - name: Structural evals
        run: python evals/run_structural.py

      - name: Helper evals
        run: python evals/run_cli.py

      - name: Hook evals
        run: python evals/run_hook.py

      - name: Phrase checks (advisory — never fails)
        run: python evals/run_phrases.py
