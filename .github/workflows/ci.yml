name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    name: evals (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Git Bash on Windows — the same shell Claude Code uses to run the plugin's hooks and the
        # council helper, so the Windows leg exercises them the way users' machines will.
        shell: bash
    env:
      # macOS ships bash 3.2 at /bin/bash and BSD sed/awk/grep. The helper and hooks promise to run
      # there, so the macOS leg runs them with that bash — not a newer one found on PATH.
      COUNCIL_EVAL_BASH: ${{ matrix.os == 'macos-latest' && '/bin/bash' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Tool versions
        run: |
          "${COUNCIL_EVAL_BASH:-bash}" -c 'echo "bash $BASH_VERSION"'
          git --version
          awk --version 2>/dev/null | head -n 1 || awk -W version 2>/dev/null | head -n 1 || echo "awk: $(command -v awk) (BSD)"

      # Every check below runs even when an earlier one failed, so one run shows every failing
      # suite (the job still fails if any does).
      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: python scripts/quick_validate.py

      - name: Structural evals
        if: ${{ !cancelled() }}
        run: python evals/run_structural.py

      - name: Helper evals
        if: ${{ !cancelled() }}
        run: python evals/run_cli.py

      - name: Model routing evals
        if: ${{ !cancelled() }}
        run: python evals/run_model_routing.py

      - name: Impact evals
        if: ${{ !cancelled() }}
        run: python evals/run_impact.py

      - name: Context evals
        if: ${{ !cancelled() }}
        run: python evals/run_context.py

      - name: Context delivery pilot (byte accounting, no model calls)
        if: ${{ !cancelled() }}
        run: python evals/run_context_pilot.py

      - name: Evidence model evals
        if: ${{ !cancelled() }}
        run: python evals/run_evidence.py

      - name: Repair loop evals
        if: ${{ !cancelled() }}
        run: python evals/run_repair.py

      - name: Memory evals
        if: ${{ !cancelled() }}
        run: python evals/run_memory.py

      - name: Seat learning evals
        if: ${{ !cancelled() }}
        run: python evals/run_seats.py

      - name: Run cockpit evals
        if: ${{ !cancelled() }}
        run: python evals/run_tui.py

      - name: Status and accounting evals
        if: ${{ !cancelled() }}
        run: python evals/run_status.py

      - name: Run history evals
        if: ${{ !cancelled() }}
        run: python evals/run_history.py

      - name: Finding outcomes evals
        if: ${{ !cancelled() }}
        run: python evals/run_outcomes.py

      - name: Tuning evals
        if: ${{ !cancelled() }}
        run: python evals/run_tune.py

      - name: Benchmark harness self-test (no model calls)
        if: ${{ !cancelled() }}
        run: python evals/bench.py self-test

      - name: Hook evals
        if: ${{ !cancelled() }}
        run: python evals/run_hook.py

      - name: Phrase checks (advisory — never fails)
        if: ${{ !cancelled() }}
        run: python evals/run_phrases.py
